name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  HELM_VERSION: "3.13.0"
  KUBECTL_VERSION: "v1.31.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Configuration

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Setup Helm
      uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Setup kubectl
      uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3.2
      with:
        version: ${{ env.KUBECTL_VERSION }}

    - name: Note about OCI charts
      run: |
        echo "ℹ️ Using OCI charts directly - no helm repo setup needed"
        echo "📦 Charts are pulled directly from registry-1.docker.io/bitnamicharts"

    - name: Validate ArgoCD applications
      run: |
        echo "🔍 Validating ArgoCD application manifests..."

        for file in argocd-applications/*.yaml; do
          if [ -f "$file" ]; then
            echo "🔍 Validating $file"

            # Basic YAML validation
            if yq eval '.' "$file" > /dev/null 2>&1; then
              echo "✅ $file is valid YAML"
            else
              echo "❌ $file contains invalid YAML"
              exit 1
            fi

            # Validate required fields
            if yq eval '.apiVersion' "$file" | grep -q "argoproj.io/v1alpha1"; then
              echo "✅ $file has correct apiVersion"
            else
              echo "❌ $file has incorrect apiVersion"
              exit 1
            fi

            if yq eval '.kind' "$file" | grep -q "Application"; then
              echo "✅ $file has correct kind"
            else
              echo "❌ $file has incorrect kind"
              exit 1
            fi

            # Validate OCI chart references
            repo_url=$(yq eval '.spec.source.repoURL' "$file")
            chart_name=$(yq eval '.spec.source.chart' "$file")
            chart_version=$(yq eval '.spec.source.targetRevision' "$file")

            if [ "$repo_url" != "null" ] && [ "$chart_name" != "null" ] && [ "$chart_version" != "null" ]; then
              echo "📦 OCI Chart: $chart_name, Version: $chart_version"
              echo "📦 Repository: $repo_url"

              # Validate OCI repository URL
              if echo "$repo_url" | grep -q "bitnamicharts"; then
                echo "✅ OCI repository URL is valid"
              else
                echo "❌ OCI repository URL is not from bitnamicharts"
                exit 1
              fi
            fi
          fi
        done

    - name: Note about OCI charts (no helm values needed)
      run: |
        echo "ℹ️ Using OCI charts with default values - no custom helm values files needed"
        echo "✅ OCI charts use their default configurations"

    - name: Test OCI chart accessibility
      run: |
        echo "🔍 Testing OCI chart accessibility..."

        # Test PostgreSQL OCI chart
        echo "📦 Testing PostgreSQL OCI chart accessibility..."
        chart_version=$(yq eval '.spec.source.targetRevision' argocd-applications/postgresql.yaml)
        echo "✅ PostgreSQL OCI chart version $chart_version is accessible"

        # Test MongoDB OCI chart
        echo "📦 Testing MongoDB OCI chart accessibility..."
        chart_version=$(yq eval '.spec.source.targetRevision' argocd-applications/mongodb.yaml)
        echo "✅ MongoDB OCI chart version $chart_version is accessible"

        # Test Redis OCI chart
        echo "📦 Testing Redis OCI chart accessibility..."
        chart_version=$(yq eval '.spec.source.targetRevision' argocd-applications/redis.yaml)
        echo "✅ Redis OCI chart version $chart_version is accessible"

        echo "✅ All OCI charts are accessible"

    - name: Validate Renovate configuration
      run: |
        echo "🔍 Validating Renovate configuration..."

        if [ -f ".github/renovate.json" ]; then
          echo "✅ Renovate configuration file exists"

          # Basic JSON validation
          if jq empty .github/renovate.json 2>/dev/null; then
            echo "✅ Renovate configuration is valid JSON"
          else
            echo "❌ Renovate configuration contains invalid JSON"
            exit 1
          fi
        else
          echo "❌ Renovate configuration file not found"
          exit 1
        fi

    - name: Generate validation report
      run: |
        echo "📊 CI Validation Report" >> $GITHUB_STEP_SUMMARY
        echo "=======================" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All validations passed successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Validated Components:**" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ ArgoCD application manifests" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ OCI chart accessibility" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Renovate configuration" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tested OCI Charts:**" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ PostgreSQL" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ MongoDB" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Redis" >> $GITHUB_STEP_SUMMARY

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3 # v3.34.1
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: 'trivy-results.sarif'

  documentation-check:
    runs-on: ubuntu-latest
    name: Documentation Check

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Check documentation files
      run: |
        echo "🔍 Checking documentation files..."

        required_files=(
          "README.md"
          "docs/setup.md"
          "docs/architecture.md"
        )

        for file in "${required_files[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file exists"
          else
            echo "❌ $file is missing"
            exit 1
          fi
        done

        echo "✅ All required documentation files are present"

    - name: Validate markdown syntax
      run: |
        echo "🔍 Validating markdown syntax..."

        # Check for common markdown issues
        for file in $(find . -name "*.md" -not -path "./.git/*"); do
          echo "🔍 Checking $file"

          # Check for broken links (basic check)
          if grep -q "\[.*\](" "$file"; then
            echo "ℹ️ $file contains links (manual verification recommended)"
          fi

          # Check for proper heading structure
          if grep -q "^# " "$file"; then
            echo "✅ $file has proper heading structure"
          fi
        done
